<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | relative_url }}">
    <script>
      // A link to a section keeps its #fragment{% if page.redirect_hash_to %}, and goes to {{ page.redirect_hash_to }}{% endif %}.
      if (location.hash) {
        location.replace({{ page.redirect_hash_to | default: page.redirect_to | relative_url | jsonify }} + location.hash);
      } else {
        location.replace({{ page.redirect_to | relative_url | jsonify }});
      }
    </script>
    <title>Spytify v2</title>
  </head>
  <body><p><a href="{{ page.redirect_to | relative_url }}">{{ page.title }}</a></p></body>
</html>

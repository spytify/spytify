name: release

# Pushing a tag such as v2.0.0-alpha.1, or running this workflow from the
# Actions tab with a version, builds every platform and prepares a GitHub
# release with the files: a draft, unless the run asks to publish it. A
# version with a "-" becomes a pre-release, which the app's update check
# counts.
on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, such as 2.0.0-alpha.1 (the tag v2.0.0-alpha.1 is made on this branch's last commit)"
        required: true
      publish:
        description: "Publish the release now instead of leaving a draft"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SPYTIFY_DEFAULT_PROCESS: ${{ vars.SPYTIFY_DEFAULT_PROCESS }}
  # The developers' Sentry project, for crash reports and anonymous stats.
  SPYTIFY_SENTRY_DSN: ${{ vars.SPYTIFY_SENTRY_DSN }}

jobs:
  # The version every job builds, from the tag or the run's input.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME#v}}"
          v="${v#v}"
          if ! [[ "$v" =~ ^2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$v is not a v2 version such as 2.0.0-alpha.1"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the desktop app's build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Tarball, .deb and .rpm
        run: SPYTIFY_VERSION="${{ needs.version.outputs.version }}" scripts/build-linux.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # Signing and notarising run once the secrets exist: MACOS_CERT_P12 (a
  # Developer ID Application certificate, base64), MACOS_CERT_PASSWORD,
  # MACOS_SIGN_IDENTITY, and the App Store Connect API key NOTARY_KEY (the
  # .p8, base64), NOTARY_KEY_ID, NOTARY_ISSUER.
  macos:
    needs: version
    runs-on: macos-15
    outputs:
      notarized: ${{ steps.notarize.outputs.done }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Spytify.app and the command-line tools
        run: SPYTIFY_VERSION="${{ needs.version.outputs.version }}" scripts/build-macos.sh dist/macos
      - name: Sign with the Developer ID
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SPYTIFY_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          pw="$(openssl rand -hex 16)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          scripts/sign-macos.sh dist/macos
      - name: Disk image and zip
        run: |
          v="${{ needs.version.outputs.version }}"
          hdiutil create -volname Spytify -srcfolder dist/macos/Spytify.app -ov -format UDZO "dist/Spytify-$v-macos.dmg"
          (cd dist/macos && zip -q -r "../spytify-$v-macos-cli.zip" spytifyd spytify-cli spytify-tap)
      - name: Notarise
        id: notarize
        if: env.MACOS_CERT_P12 != '' && env.NOTARY_KEY != ''
        env:
          SPYTIFY_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SPYTIFY_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          SPYTIFY_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          SPYTIFY_NOTARY_KEY="$RUNNER_TEMP/notary.p8" scripts/notarize-macos.sh dist/*.dmg dist/*.zip
          rm "$RUNNER_TEMP/notary.p8"
          echo "done=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.zip

  # Authenticode signing runs once WINDOWS_CERT_PFX (base64) and
  # WINDOWS_CERT_PASSWORD exist.
  windows:
    needs: version
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.sign.outputs.done }}
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Spytify.exe and the command-line tools
        run: |
          v="${{ needs.version.outputs.version }}"
          SPYTIFY_VERSION="$v" scripts/build-windows.sh "dist/spytify-$v-windows-amd64"
          cp README.md LICENSE "dist/spytify-$v-windows-amd64/"
      - name: Sign with Authenticode
        id: sign
        if: env.WINDOWS_CERT_PFX != ''
        env:
          SPYTIFY_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          sudo apt-get install -y -qq osslsigncode
          echo "$WINDOWS_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          SPYTIFY_WINDOWS_PFX="$RUNNER_TEMP/cert.pfx" scripts/sign-windows.sh "dist/spytify-${{ needs.version.outputs.version }}-windows-amd64"
          rm "$RUNNER_TEMP/cert.pfx"
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Zip
        run: |
          v="${{ needs.version.outputs.version }}"
          (cd dist && zip -q -r "spytify-$v-windows-amd64.zip" "spytify-$v-windows-amd64")
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip

  draft:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: files
      - name: Release with every file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
          SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          draft="--draft"
          [ "$PUBLISH" = true ] && draft=""
          (cd files && sha256sum * > SHA256SUMS)
          notes=""
          [ "$NOTARIZED" = true ] || notes="The macOS app is not notarised: the first time, allow it in System Settings > Privacy & Security > Open Anyway. "
          [ "$SIGNED" = true ] || notes="${notes}The Windows files are not signed, so SmartScreen warns before the first run. "
          # --target makes the tag on this commit when a manual run asks for a
          # version that has none yet.
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $draft $pre \
            --title "Spytify $TAG" --generate-notes \
            --notes "${notes}The Windows build is a first draft."

name: ci

# A change to Markdown files alone runs nothing; tags always run.
on:
  push:
    branches: [main, "v2-*"]
    tags: ["2.*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

# The default player of the builds lives in a repository variable, so the
# source names none (Settings > Secrets and variables > Actions > Variables).
env:
  SPYTIFY_DEFAULT_PROCESS: ${{ vars.SPYTIFY_DEFAULT_PROCESS }}
  # staticcheck 2026.2.2, which works with Go 1.26 and 1.27.
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.2

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (and the UI's OpenGL and X11 headers on Linux)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then scripts/ci/apt-install.sh ffmpeg gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols; else brew install ffmpeg; fi
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      # Natively, so that cgo type-checks the desktop UI too;
      # windows-staticcheck covers Windows.
      - name: staticcheck
        run: go run "$STATICCHECK" ./...
      - name: Schema is generated
        run: go generate ./pkg/proto && git diff --exit-code pkg/proto/schema.json
      - name: Setting keys are generated
        run: go generate ./internal/settings && git diff --exit-code internal/settings/keys_gen.go
      - name: Build FakePlayer, the scriptable test player (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/build-fakeplayer-macos.sh "$RUNNER_TEMP"
          scripts/allow-fakeplayer-tcc.sh "$RUNNER_TEMP/FakePlayer.app"
          echo "SPYTIFY_FAKE_APP=$RUNNER_TEMP/FakePlayer.app" >> "$GITHUB_ENV"
      - name: Unit, scenario, UI and end-to-end tests
        run: go run gotest.tools/gotestsum@v1.12.3 --format testname --jsonfile test.jsonl -- -race ./...
      - name: What macOS said about Apple events (on failure)
        if: failure() && runner.os == 'macOS'
        run: log show --last 10m --style compact --predicate 'subsystem == "com.apple.TCC" OR process == "appleeventsd" OR process == "tccd"' | grep -i -E "fakeplayer|osascript|AppleEvents" | tail -60 || true
      - name: Keep the results for the test badge
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test.jsonl
      - name: Desktop UI builds
        run: go build -o /dev/null ./cmd/spytify-ui

  # The README's "x/y passed" badge: shields.io reads tests.json from the
  # badges branch, which holds nothing else.
  badges:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-results
      - name: Publish the test count
        run: |
          passed=$(jq -s '[.[] | select(.Test != null and .Action == "pass")] | length' test.jsonl)
          failed=$(jq -s '[.[] | select(.Test != null and .Action == "fail")] | length' test.jsonl)
          color=brightgreen
          [ "$failed" -gt 0 ] && color=red
          mkdir badge && cd badge
          printf '{"schemaVersion":1,"label":"tests","message":"%s/%s passed","color":"%s"}\n' "$passed" "$((passed + failed))" "$color" > tests.json
          git init -q -b badges
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests.json
          git commit -qm "Test count of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The desktop UI needs cgo; the unit and macOS jobs build it natively.
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build ./cmd/spytifyd ./cmd/spytify-cli ./cmd/fakeplayer

  # Real Windows: the pure-Go packages and the media session poller in
  # Windows PowerShell, with the ffmpeg.exe windows-build ships.
  # windows-smoke runs the shipped executables.
  windows:
    needs: windows-build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - uses: actions/download-artifact@v4
        with:
          name: spytify-windows
          path: shipped
      - name: The shipped ffmpeg.exe first on PATH
        run: |
          # It has only what Spytify runs: a test that needs more fails.
          # Chocolatey's stays for ffprobe, which some tests read files with.
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          cp shipped/ffmpeg.exe "$RUNNER_TEMP/ffmpeg/"
          cygpath -w "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      - name: Unit tests (all but the desktop UI, which windows-build cross-compiles)
        run: CGO_ENABLED=0 go test $(go list ./... | grep -v -e /internal/ui$ -e /cmd/spytify-ui)

  # staticcheck for Windows, from Linux with MinGW-w64, as windows-build
  # compiles: the desktop UI needs cgo, which the windows job goes without.
  windows-staticcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MinGW-w64
        run: scripts/ci/apt-install.sh mingw-w64
      - name: staticcheck
        run: |
          # Built for Linux, where it runs, then pointed at Windows.
          GOBIN="$RUNNER_TEMP" go install "$STATICCHECK"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc "$RUNNER_TEMP/staticcheck" ./...

  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The build's version counts the commits since the latest tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MinGW-w64, nasm and 7-Zip
        run: scripts/ci/apt-install.sh mingw-w64 nasm 7zip
      # ffmpeg takes minutes to build: it is built again when its script
      # changes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spytify/ffmpeg-*
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Spytify.exe, spytifyd.exe, spytify-cli.exe, spytify-tap.exe, ffmpeg.exe, Mesa
        run: scripts/build-windows.sh dist/windows
        env:
          SPYTIFY_SENTRY_DSN: ${{ vars.SPYTIFY_SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        with:
          name: spytify-windows
          path: dist/windows/

  # The executables windows-build ships, run on a real Windows.
  windows-smoke:
    needs: windows-build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spytify-windows
      - name: The command-line tools start
        run: |
          ./spytifyd.exe -version
          ./spytify-cli.exe --help > /dev/null
          set +e; ./spytify-tap.exe; code=$?; set -e
          test "$code" -eq 2
      - name: Windows finds the app's icon and version information
        shell: pwsh
        run: |
          Add-Type -Namespace Win32 -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint n);'
          $path = (Resolve-Path Spytify.exe).Path
          # Index -1 counts the icons in the file.
          $icons = [Win32.Shell]::ExtractIconEx($path, -1, $null, $null, 0)
          $v = (Get-Item $path).VersionInfo
          "Spytify.exe: $icons icon, $($v.ProductName) $($v.ProductVersion), $($v.FileDescription)"
          if ($icons -lt 1 -or $v.ProductName -ne "Spytify") { throw "Spytify.exe has no icon or no version information" }
          # Only the app has one.
          foreach ($f in "spytifyd.exe", "spytify-cli.exe", "spytify-tap.exe") {
            if ([Win32.Shell]::ExtractIconEx((Resolve-Path $f).Path, -1, $null, $null, 0) -ne 0) { throw "$f has an icon" }
          }
      - name: Without an OpenGL driver, the app draws its window with Mesa's
        shell: pwsh
        run: |
          # The runner has no graphics card, so no driver offers OpenGL, as on
          # a computer whose card is disabled. The app starts itself again
          # with Mesa's, from opengl\.
          Start-Process .\Spytify.exe -RedirectStandardError gl-err.txt -RedirectStandardOutput gl-out.txt
          $window = $null
          for ($i = 0; $i -lt 30 -and -not $window; $i++) {
            Start-Sleep -Seconds 1
            $window = Get-Process Spytify -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1
          }
          $gl = if ($window) { ($window.Modules | Where-Object ModuleName -eq 'opengl32.dll').FileName }
          $title = if ($window) { $window.MainWindowTitle }
          Get-Process Spytify, spytifyd -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          $said = Get-Content gl-err.txt -Raw
          "window '$title', drawn with $gl"
          "Spytify.exe said: $said"
          if (-not $window) { throw "no Spytify window within 30 s" }
          if ($said -match 'no graphics driver offers OpenGL') { throw "Spytify.exe said why it has no window instead of drawing it with Mesa" }
          if ($gl -ne (Join-Path (Resolve-Path opengl).Path 'opengl32.dll')) { throw "the window is drawn with $gl, not Mesa's" }
      - name: Without an OpenGL driver or Mesa, the app says why instead of closing without a word
        shell: pwsh
        run: |
          # As a build with SPYTIFY_NO_MESA=1. The app's message box waits for
          # a click.
          Rename-Item opengl opengl-off
          try {
            $p = Start-Process .\Spytify.exe -PassThru -RedirectStandardError ui-err.txt -RedirectStandardOutput ui-out.txt
            # Keeps the exit code readable once the process is gone.
            $null = $p.Handle
            Start-Sleep -Seconds 10
            $open = -not $p.HasExited
            $recorder = [bool](Get-Process spytifyd -ErrorAction SilentlyContinue)
            if ($open) { Stop-Process -Id $p.Id -Force; $p.WaitForExit() }
            $said = Get-Content ui-err.txt -Raw
            "Spytify.exe said: $said"
            if (-not $open) { throw "Spytify.exe closed (exit $($p.ExitCode)) instead of showing why" }
            if ($said -notmatch 'no graphics driver offers OpenGL') { throw "Spytify.exe did not say why" }
            if ($recorder) { throw "Spytify.exe started the recorder" }
          } finally {
            Rename-Item opengl-off opengl
          }
      - name: spytifyd finds the ffmpeg.exe shipped beside it
        run: |
          # No ffmpeg on this runner's PATH: only the bundled copy can pass.
          ! command -v ffmpeg
          export SPYTIFY_SOCKET="$RUNNER_TEMP/s.sock" SPYTIFY_CONFIG="$RUNNER_TEMP/config.toml"
          ./spytifyd.exe > spytifyd.log 2>&1 &
          for i in $(seq 30); do ./spytify-cli.exe info > info.txt 2>&1 && break; sleep 1; done
          cat info.txt
          ./spytify-cli.exe shutdown || true
          grep -F "[ok  ] ffmpeg found" info.txt
      - name: Without an audio output, the capture helper takes 48 kHz and says why
        run: |
          # A process to record, by its Windows PID (bash's $! is not one).
          pid=$(powershell -NoProfile -Command '(Start-Process powershell -ArgumentList "-NoProfile","-Command","Start-Sleep 30" -WindowStyle Hidden -PassThru).Id' | tr -d '\r')
          set +e; timeout 20 ./spytify-tap.exe --pid "$pid" > /dev/null 2> tap-none.err; code=$?; set -e
          echo "spytify-tap exit $code"
          cat tap-none.err
          grep -F "recording $pid at 48000 Hz: no output device gives its mix rate" tap-none.err
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: scripts/ci
      - name: An audio output for the runner (the Scream virtual driver)
        shell: pwsh
        run: src/scripts/ci/windows-audio-device.ps1
      - name: The capture helper records a process playing a tone at its output's mix rate, and pins its volume
        run: |
          # A process playing, by its Windows PID (bash's $! is not one).
          pid=$(powershell -NoProfile -Command '(Start-Process powershell -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File","src/scripts/ci/tone.ps1" -WindowStyle Hidden -PassThru).Id' | tr -d '\r')
          # Until Windows plays it, which tone.ps1 reads on its audio
          # session's meter: a fixed wait lost the race on a slow runner.
          ready="$(cygpath -u "$RUNNER_TEMP")/tone.wav.playing"
          for i in $(seq 60); do [ -f "$ready" ] && break; sleep 1; done
          test -f "$ready" || { echo "the tone did not play within 60 s"; exit 1; }
          # A slow runner can spend over a second starting the helper, so
          # it records 5 s, of which at least 2 s must be the tone.
          set +e; timeout 5 ./spytify-tap.exe --pid "$pid" > tap.raw 2> tap.err; code=$?; set -e
          echo "spytify-tap exit $code (124: stopped by timeout)"
          cat tap.err
          python src/scripts/ci/tap-level.py tap.raw 2 -20
          # The tone plays to the runner's only output, whose mix rate the
          # helper finds through the tone's audio session.
          mix=$(powershell -NoProfile -ExecutionPolicy Bypass -File src/scripts/ci/mix-rate.ps1 | tr -d '\r')
          echo "the default output mixes at $mix Hz"
          head -n 1 tap.raw | grep -F "SPYTIFY-TAP f32le $mix 2"
          grep -F "recording $pid at $mix Hz, the mix rate of" tap.err
          if grep -q -F "the default output" tap.err; then echo "the helper did not find the tone's audio session"; exit 1; fi
          ./spytify-tap.exe --pid "$pid" --set-volume 0.25
          v=$(./spytify-tap.exe --pid "$pid" --get-volume | tr -d '\r')
          echo "volume $v"
          test "$v" = "0.250"

  # An investigation for player.mute_output on Windows, not a test: what
  # process loopback records from a muted session, and whether Windows keeps
  # the mute after the process ends. The step prints the numbers.
  windows-mute-probe:
    needs: windows-build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spytify-windows
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: scripts/ci
      - name: An audio output for the runner (the Scream virtual driver)
        shell: pwsh
        run: src/scripts/ci/windows-audio-device.ps1
      - name: What process loopback records from a muted session, and whether the mute outlives the process
        run: bash src/scripts/ci/mute-probe.sh

  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The build's version counts the commits since the latest tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nasm, and Homebrew's ffmpeg for ffprobe
        run: brew install nasm ffmpeg
      # ffmpeg takes minutes to build: it is built again when its script
      # changes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spytify/ffmpeg-*
          key: ffmpeg-macos-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Spytify.app, with ffmpeg, and universal spytifyd, spytify-cli, spytify-tap
        run: scripts/build-macos.sh dist
        env:
          SPYTIFY_SENTRY_DSN: ${{ vars.SPYTIFY_SENTRY_DSN }}
      - name: The encode and tag tests with the app's ffmpeg, on each processor
        run: |
          # It has only what Spytify runs: a test that needs more fails.
          # Homebrew's stays for ffprobe, which some tests read files with.
          # The x86_64 half runs under Rosetta.
          f=dist/Spytify.app/Contents/MacOS/ffmpeg
          for arch in arm64 x86_64; do
            # From macOS 14.2, as the app, loading nothing but libSystem.
            vtool -arch $arch -show-build "$f" | grep -E '^ *minos 14\.2$'
            test "$(otool -arch $arch -L "$f" | tail -n +2 | awk '{ print $1 }')" = /usr/lib/libSystem.B.dylib
            mkdir -p "$RUNNER_TEMP/ffmpeg-$arch"
            lipo -thin $arch -output "$RUNNER_TEMP/ffmpeg-$arch/ffmpeg" "$f"
            PATH="$RUNNER_TEMP/ffmpeg-$arch:$PATH" go test -count=1 ./internal/encode/... ./internal/tag/...
          done
      # A disk image keeps the app's executable bits, which an artifact's zip
      # drops.
      - name: Disk image and command-line zip
        run: |
          scripts/dmg-macos.sh dist/Spytify.app dist/Spytify-macos.dmg
          (cd dist && zip -q -y -r spytify-macos-cli.zip spytifyd spytify-cli spytify-tap)
      - uses: actions/upload-artifact@v4
        with:
          name: spytify-macos
          path: |
            dist/Spytify-macos.dmg
            dist/spytify-macos-cli.zip

  # The Linux packages of a release, from every push: a tarball, .deb, .rpm.
  # Built on Ubuntu 22.04, as the release's, for its glibc.
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The build's version counts the commits since the latest tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the desktop app's build dependencies
        run: scripts/ci/apt-install.sh gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Tarball, .deb and .rpm
        run: scripts/build-linux.sh dist
        env:
          SPYTIFY_SENTRY_DSN: ${{ vars.SPYTIFY_SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        with:
          name: spytify-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # The .deb on the supported Debian and Ubuntu releases the player runs on
  # (its Snap from Ubuntu 22.04 and Debian 12, its own .deb from Ubuntu 24.04
  # and Debian 13), each in a clean container: it installs with its
  # dependencies, and the app opens its window drawn by Mesa on the
  # processor, as on a computer without a graphics card. The interim Ubuntu
  # releases are left out: their archive goes away nine months after.
  linux-install:
    name: linux-install (${{ matrix.image }})
    needs: linux-build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spytify-linux
      - name: The .deb installs, and the command-line tools start
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./spytify_*_amd64.deb
          if ldd /usr/bin/spytify-ui | grep 'not found'; then exit 1; fi
          spytifyd -version
          spytify-cli --help > /dev/null
      - name: The app opens its window with Mesa's software renderer
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xdotool mesa-utils
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          export DISPLAY=:99 XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          for i in $(seq 50); do xdotool getdisplaygeometry > /dev/null 2>&1 && break; sleep 0.2; done
          glxinfo -B | grep -F 'OpenGL renderer string: llvmpipe'
          spytify-ui > ui.log 2>&1 &
          for i in $(seq 60); do xdotool search --onlyvisible --name '^Spytify$' > window.txt && break; sleep 1; done
          cat ui.log
          test -s window.txt || { echo "no Spytify window within 60 s"; exit 1; }
          xdotool getwindowgeometry "$(head -n 1 window.txt)"

  # Gate 1 of M1: the fake player recorded through PipeWire and MPRIS, every
  # file matched sample by sample against its source.
  # The timelines play in real time, so the tests run in three jobs at once,
  # each on its own runner: a shared CPU makes the timing tests flaky. The
  # shards cover every test: a new timeline lands in the second, a new test
  # in the third.
  pipewire-gate:
    name: pipewire-gate (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    container: golang:1.26-trixie
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: timelines 1
            tests: "-run 'TestRecordFakePlayer/^(basic|jitter|control|quiet-start)$'"
          - name: timelines 2
            tests: "-run TestRecordFakePlayer -skip 'TestRecordFakePlayer/^(basic|jitter|control|quiet-start)$'"
          - name: app
            tests: "-skip TestRecordFakePlayer"
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire, WirePlumber, D-Bus and ffmpeg
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pipewire pipewire-bin pipewire-pulse wireplumber dbus dbus-bin ffmpeg pulseaudio-utils procps python3
      # For TestUIStaysIdleWhileRecording: the desktop app on a virtual
      # display with software OpenGL.
      - name: Install a virtual display and the desktop app's build dependencies
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth libgl1-mesa-dri gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Record the timelines, and measure the app while it records
        run: |
          # The checkout belongs to the runner user, not the container's root:
          # without this, git refuses it and go build cannot stamp the version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . scripts/pipewire-session.sh
          xvfb-run -a -s "-screen 0 1280x800x24" go test -tags integration -v -timeout 20m ${{ matrix.shard.tests }} ./test/integration/

  # Whether the capture adds no conversion to a 44.1 kHz stream: bit for bit
  # under the gate's rates, which let the graph run at the stream's rate, and
  # converted once, by PipeWire alone, under its own rates (the graph at
  # 48 kHz only, as on most computers).
  pipewire-bitexact:
    name: pipewire-bitexact (${{ matrix.rates }})
    runs-on: ubuntu-24.04
    container: golang:1.26-trixie
    strategy:
      fail-fast: false
      matrix:
        rates: [default, 44100]
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire, WirePlumber, D-Bus and the PulseAudio tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pipewire pipewire-bin pipewire-pulse wireplumber dbus dbus-bin pulseaudio-utils procps python3
      - name: Record a 44.1 kHz noise through each backend, bit for bit at a 44.1 kHz graph, converted once at 48 kHz
        env:
          SPYTIFY_PIPEWIRE_RATES: ${{ matrix.rates }}
        run: |
          . scripts/pipewire-session.sh
          pipewire-pulse >"$XDG_RUNTIME_DIR/pipewire-pulse.log" 2>&1 &
          for i in $(seq 50); do pactl info >/dev/null 2>&1 && break; sleep 0.1; done
          go test -tags integration -v -count=1 -run TestTheCaptureAddsNoConversionToA44100HzSource ./internal/capture/

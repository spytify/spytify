name: ci

on:
  push:
    branches: [main, "v2-*"]
    tags: ["2.*"]
  pull_request:

permissions:
  contents: read

# The default player of the builds lives in a repository variable, so the
# source names none (Settings > Secrets and variables > Actions > Variables).
env:
  SPYTIFY_DEFAULT_PROCESS: ${{ vars.SPYTIFY_DEFAULT_PROCESS }}

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (and the UI's OpenGL and X11 headers on Linux)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols; else brew install ffmpeg; fi
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Schema is generated
        run: go generate ./pkg/proto && git diff --exit-code pkg/proto/schema.json
      - name: Build FakePlayer, the scriptable test player (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/build-fakeplayer-macos.sh "$RUNNER_TEMP"
          scripts/allow-fakeplayer-tcc.sh "$RUNNER_TEMP/FakePlayer.app"
          echo "SPYTIFY_FAKE_APP=$RUNNER_TEMP/FakePlayer.app" >> "$GITHUB_ENV"
      - name: Unit, scenario, UI and end-to-end tests
        run: go run gotest.tools/gotestsum@v1.12.3 --format testname --jsonfile test.jsonl -- -race ./...
      - name: What macOS said about Apple events (on failure)
        if: failure() && runner.os == 'macOS'
        run: log show --last 10m --style compact --predicate 'subsystem == "com.apple.TCC" OR process == "appleeventsd" OR process == "tccd"' | grep -i -E "fakeplayer|osascript|AppleEvents" | tail -60 || true
      - name: Keep the results for the test badge
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test.jsonl
      - name: Desktop UI builds
        run: go build -o /dev/null ./cmd/spytify-ui

  # The README's "x/y passed" badge: shields.io reads tests.json from the
  # badges branch, which holds nothing else.
  badges:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-results
      - name: Publish the test count
        run: |
          passed=$(jq -s '[.[] | select(.Test != null and .Action == "pass")] | length' test.jsonl)
          failed=$(jq -s '[.[] | select(.Test != null and .Action == "fail")] | length' test.jsonl)
          color=brightgreen
          [ "$failed" -gt 0 ] && color=red
          mkdir badge && cd badge
          printf '{"schemaVersion":1,"label":"tests","message":"%s/%s passed","color":"%s"}\n' "$passed" "$((passed + failed))" "$color" > tests.json
          git init -q -b badges
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests.json
          git commit -qm "Test count of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges

  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The desktop UI needs cgo; the unit and macOS jobs build it natively.
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build ./cmd/spytifyd ./cmd/spytify-cli ./cmd/fakeplayer

  # Real Windows: the pure-Go packages and the media session poller in
  # Windows PowerShell. windows-smoke runs the shipped executables.
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Unit tests (all but the desktop UI, which windows-build cross-compiles)
        run: CGO_ENABLED=0 go test $(go list ./... | grep -v -e /internal/ui$ -e /cmd/spytify-ui)

  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Spytify.exe, spytifyd.exe, spytify-cli.exe, spytify-tap.exe
        run: scripts/build-windows.sh dist/windows
        env:
          SPYTIFY_SENTRY_DSN: ${{ vars.SPYTIFY_SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        with:
          name: spytify-windows
          path: dist/windows/

  # The executables windows-build ships, run on a real Windows.
  windows-smoke:
    needs: windows-build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spytify-windows
      - name: The command-line tools start
        run: |
          ./spytifyd.exe -version
          ./spytify-cli.exe --help > /dev/null
          set +e; ./spytify-tap.exe; code=$?; set -e
          test "$code" -eq 2
      - name: spytifyd finds the ffmpeg.exe shipped beside it
        run: |
          # No ffmpeg on this runner's PATH: only the bundled copy can pass.
          ! command -v ffmpeg
          export SPYTIFY_SOCKET="$RUNNER_TEMP/s.sock" SPYTIFY_CONFIG="$RUNNER_TEMP/config.toml"
          ./spytifyd.exe > spytifyd.log 2>&1 &
          for i in $(seq 30); do ./spytify-cli.exe info > info.txt 2>&1 && break; sleep 1; done
          cat info.txt
          ./spytify-cli.exe shutdown || true
          grep -F "[ok  ] ffmpeg found" info.txt
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: scripts/ci
      - name: An audio output for the runner (the Scream virtual driver)
        shell: pwsh
        run: src/scripts/ci/windows-audio-device.ps1
      - name: The capture helper records a process playing a tone, and pins its volume
        run: |
          # A process playing, by its Windows PID (bash's $! is not one).
          pid=$(powershell -NoProfile -Command '(Start-Process powershell -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File","src/scripts/ci/tone.ps1" -WindowStyle Hidden -PassThru).Id' | tr -d '\r')
          sleep 4
          set +e; timeout 3 ./spytify-tap.exe --pid "$pid" > tap.raw; code=$?; set -e
          echo "spytify-tap exit $code (124: stopped by timeout)"
          python src/scripts/ci/tap-level.py tap.raw 2 -20
          ./spytify-tap.exe --pid "$pid" --set-volume 0.25
          v=$(./spytify-tap.exe --pid "$pid" --get-volume | tr -d '\r')
          echo "volume $v"
          test "$v" = "0.250"

  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Spytify.app and universal spytifyd, spytify-cli, spytify-tap
        run: scripts/build-macos.sh dist
        env:
          SPYTIFY_SENTRY_DSN: ${{ vars.SPYTIFY_SENTRY_DSN }}
      # A disk image keeps the app's executable bits, which an artifact's zip
      # drops.
      - name: Disk image and command-line zip
        run: |
          scripts/dmg-macos.sh dist/Spytify.app dist/Spytify-macos.dmg
          (cd dist && zip -q -y -r spytify-macos-cli.zip spytifyd spytify-cli spytify-tap)
      - uses: actions/upload-artifact@v4
        with:
          name: spytify-macos
          path: |
            dist/Spytify-macos.dmg
            dist/spytify-macos-cli.zip

  # The Linux packages of a release, from every push: a tarball, .deb, .rpm.
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the desktop app's build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Tarball, .deb and .rpm
        run: scripts/build-linux.sh dist
        env:
          SPYTIFY_SENTRY_DSN: ${{ vars.SPYTIFY_SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        with:
          name: spytify-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # Gate 1 of M1: the fake player recorded through PipeWire and MPRIS, every
  # file matched sample by sample against its source.
  pipewire-gate:
    runs-on: ubuntu-24.04
    container: golang:1.26-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire, WirePlumber, D-Bus and ffmpeg
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pipewire pipewire-bin pipewire-pulse wireplumber dbus dbus-bin ffmpeg pulseaudio-utils procps python3
      # For TestUIStaysIdleWhileRecording: the desktop app on a virtual
      # display with software OpenGL.
      - name: Install a virtual display and the desktop app's build dependencies
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth libgl1-mesa-dri gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Record the timelines, and measure the app while it records
        run: |
          # The checkout belongs to the runner user, not the container's root:
          # without this, git refuses it and go build cannot stamp the version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . scripts/pipewire-session.sh
          xvfb-run -a -s "-screen 0 1280x800x24" go test -tags integration -v -timeout 20m ./test/integration/
